[package]
name = "openclaw-bot"
version = "0.1.0"
edition = "2021"
authors = ["OpenClaw Bot Contributors"]
description = "A bot that assists with planning on Notion and managing tasks on GitHub repositories"

[dependencies]
# HTTP client for API requests
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenv = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# GitHub API client
octocrab = "0.39"

# Notion API (using reqwest directly since no official Rust client)
# Will implement custom Notion client
